---
applications:
  - name: coreshift
    memory: 1G
    disk_quota: 2G
    instances: 1
    buildpacks:
      - python_buildpack
    command: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    health-check-type: http
    health-check-http-endpoint: /_stcore/health
    timeout: 180
    env:
      PYTHONUNBUFFERED: "true"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      # SAP AI Core credentials
      AICORE_CLIENT_ID: "<your-aicore-client-id>"
      AICORE_CLIENT_SECRET: "<your-aicore-client-secret>"
      AICORE_AUTH_URL: "<your-aicore-auth-url>"
      AICORE_BASE_URL: "<your-aicore-base-url>"
      AICORE_RESOURCE_GROUP: "default"
      SAP_AI_CORE_CLIENT_ID: "<your-sap-ai-core-client-id>"
      SAP_AI_CORE_CLIENT_SECRET: "<your-sap-ai-core-client-secret>"
      SAP_AI_CORE_AUTH_URL: "<your-sap-ai-core-auth-url>"
      SAP_AI_CORE_API_URL: "<your-sap-ai-core-api-url>"
      SAP_AI_CORE_DEPLOYMENT_ID: "<your-deployment-id>"
      SAP_AI_CORE_RESOURCE_GROUP: "default"
      GROQ_API_KEY: "<your-groq-api-key>"